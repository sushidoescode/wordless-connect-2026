<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#200b2b" />
    <title>WORDLESS Relay</title>
  </head>
  <body>
    <main id="join-view" class="join-shell">
      <form id="join-form" class="join-card" novalidate>
        <span class="eyebrow">WORDLESS RELAY</span>
        <h1>JOIN THE GUESSER</h1>
        <label for="session-code">Six-character session code</label>
        <input
          id="session-code"
          name="session-code"
          type="text"
          inputmode="text"
          autocomplete="off"
          autocapitalize="characters"
          pattern="[A-Za-z0-9]{6}"
          required
        />
        <button type="submit">JOIN ROUND</button>
        <p id="join-error" role="alert"></p>
      </form>
    </main>
    <main class="app-shell" hidden>
      <header class="brand-row">
        <div>
          <span class="eyebrow">WORDLESS RELAY</span>
          <span class="role-label">GUESSER</span>
          <h1>GUESS THE CLUE</h1>
        </div>
        <p id="connection" role="status"><span aria-hidden="true"></span> CONNECTING</p>
      </header>
      <p id="timer" role="timer" aria-label="Time remaining"></p>
      <section id="choices" class="choice-grid" aria-label="Answer choices"></section>
      <section class="play-field" aria-labelledby="play-title">
        <h2 id="play-title" class="visually-hidden">Live clue from the painter</h2>
        <canvas id="stroke-canvas" width="1000" height="620" role="img" aria-label="Live clue drawing"></canvas>
        <div id="glyph-medallion" hidden aria-label="Solved clue glyph"></div>
      </section>
      <p id="result" aria-live="assertive"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
